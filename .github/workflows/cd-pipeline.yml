name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  images:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend
            dir: backend
            dockerfile: backend/Dockerfile
            platforms: linux/amd64,linux/arm64
            suffix: sesume_backend
            port: 4100
            health: /api/healthz
          - name: frontend
            dir: frontend
            dockerfile: frontend/Dockerfile
            platforms: linux/amd64,linux/arm64
            suffix: sesume_frontend
            port: 8080
            health: /
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.service.suffix }}
      DATABASE_URL: postgresql://sesume:sesume@127.0.0.1:5432/sesume
      AUTH_SECRET: ci-smoke-not-a-real-secret
      DATA_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sesume
          POSTGRES_PASSWORD: sesume
          POSTGRES_DB: sesume
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sesume"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for the gates
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service.dir }}
          file: ${{ matrix.service.dockerfile }}
          target: prod
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore.yaml:/.trivyignore.yaml" \
            aquasec/trivy:0.76.2 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs usr/local --skip-dirs root/.cache \
            --ignorefile /.trivyignore.yaml \
            "$IMAGE:$SHA"

      - name: Smoke test
        run: |
          docker run -d --name smoke --network host \
            -e DATABASE_URL \
            -e AUTH_SECRET \
            -e DATA_KEY \
            "$IMAGE:$SHA"
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${{ matrix.service.port }}${{ matrix.service.health }}" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1

      - name: Push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service.dir }}
          file: ${{ matrix.service.dockerfile }}
          target: prod
          push: true
          platforms: ${{ matrix.service.platforms }}
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:latest
          # Separate export scopes: a shared one loses the arm64 leg on every push.
          cache-from: |
            type=gha,scope=${{ matrix.service.name }}
            type=gha,scope=${{ matrix.service.name }}-multiarch
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}-multiarch

      - name: Cleanup
        if: always()
        run: docker rm -f smoke || true

  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      AWS_REGION: ap-southeast-1
      REPOSITORY: sesume_backend_lambda
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Print the token subject
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$token" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq -r '"sub=" + .sub, "aud=" + .aud'

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::566112927489:role/sesume-cd
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve account
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "IMAGE=$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/$REPOSITORY" >> "$GITHUB_ENV"
          echo "BUCKET=sesume-dist-$ACCOUNT" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "${IMAGE%/*}"

      - name: Build the lambda image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: backend/Dockerfile.lambda
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ env.SHA }}
          cache-from: |
            type=gha,scope=backend-lambda
            type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend-lambda

      - name: Scan
        run: |
          # var/lang and var/runtime are the runtime the Lambda base image ships, not this image's own dependencies.
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore.yaml:/.trivyignore.yaml" \
            aquasec/trivy:0.76.2 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs usr/local --skip-dirs root/.cache \
            --skip-dirs var/lang --skip-dirs var/runtime \
            --ignorefile /.trivyignore.yaml \
            "$IMAGE:$SHA"

      - name: Push the lambda image
        run: docker push "$IMAGE:$SHA"

      - name: Roll the functions
        run: |
          for function in api worker migrate; do
            if aws lambda get-function --function-name "sesume-$function" >/dev/null 2>&1; then
              aws lambda update-function-code \
                --function-name "sesume-$function" \
                --image-uri "$IMAGE:$SHA" \
                --query 'FunctionName' --output text
            else
              echo "sesume-$function does not exist yet, skipped"
            fi
          done

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload the frontend
        run: aws s3 sync frontend/dist "s3://$BUCKET/" --delete
