name: CD

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-lambda:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      SHA: ${{ github.sha }}
      AWS_REGION: ap-southeast-1
      REPOSITORY: sesume_backend_lambda
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::566112927489:role/sesume-cd
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve account
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "IMAGE=$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/$REPOSITORY" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "${IMAGE%/*}"

      - name: Build the lambda image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./backend
          file: backend/Dockerfile.lambda
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ env.SHA }}
          cache-from: |
            type=gha,scope=backend-lambda
          cache-to: type=gha,mode=max,scope=backend-lambda

      - name: Scan
        run: |
          # var/lang and var/runtime are the runtime the Lambda base image ships, not this image's own dependencies.
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/backend/.trivyignore-lambda.yaml:/ignore.yaml" \
            aquasec/trivy:0.76.2 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs usr/local --skip-dirs root/.cache \
            --skip-dirs var/lang --skip-dirs var/runtime \
            --ignorefile /ignore.yaml \
            "$IMAGE:$SHA"

      - name: SBOM
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/out" \
            aquasec/trivy:0.76.2 image \
            --format cyclonedx \
            --output /out/sbom-lambda.cdx.json \
            "$IMAGE:$SHA"

      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-lambda
          path: sbom-lambda.cdx.json
          retention-days: 30

      - name: Push the lambda image
        run: docker push "$IMAGE:$SHA"

      - name: Roll the migrator
        run: |
          if aws lambda get-function --function-name sesume-migrate >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name sesume-migrate \
              --image-uri "$IMAGE:$SHA" \
              --query 'FunctionName' --output text
            aws lambda wait function-updated --function-name sesume-migrate
          else
            echo "sesume-migrate does not exist yet, skipped"
          fi

      - name: Migrate the database
        run: |
          if ! aws lambda get-function --function-name sesume-migrate >/dev/null 2>&1; then
            echo "sesume-migrate does not exist yet, skipped"
            exit 0
          fi
          result=$(aws lambda invoke \
            --function-name sesume-migrate \
            --region "$AWS_REGION" \
            --cli-read-timeout 330 \
            --payload '{}' \
            /tmp/migrate.json)
          echo "$result"
          if echo "$result" | jq -e '.FunctionError' >/dev/null; then
            echo "the migration failed:"
            jq -r '.errorMessage // .' /tmp/migrate.json
            exit 1
          fi

      - name: Roll the functions
        run: |
          for function in api worker probe; do
            if aws lambda get-function --function-name "sesume-$function" >/dev/null 2>&1; then
              aws lambda update-function-code \
                --function-name "sesume-$function" \
                --image-uri "$IMAGE:$SHA" \
                --query 'FunctionName' --output text
            else
              echo "sesume-$function does not exist yet, skipped"
            fi
          done

  deploy-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::566112927489:role/sesume-cd
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve the bucket
        run: echo "BUCKET=sesume-dist-$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload the frontend
        run: aws s3 sync frontend/dist "s3://$BUCKET/" --delete --exclude "bootstrap/*"
