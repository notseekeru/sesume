name: gate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: cp RESUME.template.latex RESUME.latex
      - run: nix develop --command skills/resume/scripts/check.sh RESUME.latex
