name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format gate
        run: git diff --exit-code

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        if: matrix.service == 'backend'
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=high

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan the container definitions
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            aquasec/trivy:0.76.2 config \
            --severity HIGH,CRITICAL --exit-code 1 \
            --ignorefile /src/.trivyignore.yaml \
            --skip-dirs node_modules --skip-dirs .git \
            /src

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan the history
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          gitleaks git . --redact --no-banner
