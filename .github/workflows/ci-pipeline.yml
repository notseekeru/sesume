name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/**"
      - ".trivyignore.yaml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/**"
      - ".trivyignore.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan the container definitions
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            aquasec/trivy:0.76.2 config \
            --severity HIGH,CRITICAL --exit-code 1 \
            --ignorefile /src/.trivyignore.yaml \
            --skip-dirs node_modules --skip-dirs .git \
            /src
