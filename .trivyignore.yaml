misconfigurations:
  - id: DS-0002
    paths:
      - backend/Dockerfile.lambda
    statement: >-
      The Lambda base image starts the function as root inside a per-invocation sandbox, and the handler
      writes only to /tmp. Setting a USER means chowning ${LAMBDA_TASK_ROOT} and the texlive tree, which
      no test here can confirm before the deploy replaces the live function.
    expired_at: 2027-02-01
vulnerabilities:
  - id: CVE-2023-32700
    statement: >-
      libsynctex arrives with alpine's texlive, installed for pdflatex. src/latex.ts runs pdflatex with
      -no-shell-escape and openin_any/openout_any set to paranoid, and never asks for synctex output,
      so the vulnerable path is not reachable. Alpine's apk is newer than trivy's recorded fix
      version, so no upgrade clears the finding.
    expired_at: 2027-02-01
